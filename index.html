<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAMMUTH•EV™ | GLOBAL FOLK & TRADITIONS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Georgia', serif; background: #0a0a0a; color: #f0e6d3; }
    header {
      padding: 20px 30px;
      background: #0a0a0a;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.2rem; letter-spacing: 0.2em; color: #c9a96e; }
    header p { font-size: 0.75rem; color: #888; letter-spacing: 0.1em; }
    #map { width: 100%; height: calc(100vh - 120px); }
    .legend {
      padding: 15px 30px;
      background: #0a0a0a;
      border-top: 1px solid #2a2a2a;
      display: flex;
      gap: 30px;
      font-size: 0.75rem;
      color: #888;
    }
    .legend span { display: flex; align-items: center; gap: 8px; }
    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot.religiosa { background: #c9a96e; }
    .dot.sagra { background: #e07b39; }
    .dot.palio { background: #6e9ec9; }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:15px;">
    <img src="Sostituzione_testo_su_immagine_MAMMUTH_ev_.png" 
         alt="MAMMUTH•ev™" 
         style="height:50px; width:auto;">
    <div>
      <h1>MAMMUTH•EV™</h1>
      <p>GLOBAL FOLK & TRADITIONS — Where Communities Come Alive</p>
    </div>
  </div>
  <div style="text-align:right; font-size:0.75rem; color:#888;">
    <p>KREATIO UNIVERSAL SYSTEM™</p>
    <p>Code 3620</p>
  </div>
</header>

<div id="map"></div>

<div class="legend">
  <span><span class="dot religiosa"></span> Festa religiosa / Heritage</span>
  <span><span class="dot sagra"></span> Sagra enogastronomica</span>
  <span><span class="dot palio"></span> Palio / Rievocazione storica</span>
</div>

<script>
  const map = L.map('map', {
    center: [41.9, 12.8],
    zoom: 8,
    zoomControl: true
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap contributors © CARTO',
    maxZoom: 19
  }).addTo(map);

  const colori = {
    'festa_religiosa': '#c9a96e',
    'sagra': '#e07b39',
    'palio': '#6e9ec9'
  };

  const geojsonFiles = [
    'data/lazio/latina.geojson',
    'data/lazio/data/lazio/roma.geojson',
   'data/lazio/data/viterbo.geojson'
];

  geojsonFiles.forEach(file => {
    fetch(file)
      .then(r => r.json())
      .then(data => {
        L.geoJSON(data, {
          pointToLayer: function(feature, latlng) {
            const colore = colori[feature.properties.tipo] || '#ffffff';
            return L.circleMarker(latlng, {
              radius: 10,
              fillColor: colore,
              color: '#ffffff',
              weight: 1.5,
              opacity: 0.9,
              fillOpacity: 0.85
            });
          },
          onEachFeature: function(feature, layer) {
            const p = feature.properties;
            layer.bindPopup(`
              <div style="font-family:Georgia,serif; min-width:220px;">
                <h3 style="color:#c9a96e; font-size:0.9rem; margin-bottom:8px;">
                  ${p.nome}
                </h3>
                <p style="font-size:0.75rem; color:#555; margin-bottom:4px;">
                  📍 ${p.comune} (${p.provincia})
                </p>
                <p style="font-size:0.75rem; color:#555; margin-bottom:4px;">
                  🗓 ${p.periodo || p.data_inizio || 'N/D'}
                </p>
                <p style="font-size:0.75rem; color:#555; margin-bottom:8px;">
                  🏛 ${p.ente_organizzatore}
                </p>
                <p style="font-size:0.72rem; color:#777; line-height:1.4;">
                  ${p.descrizione_storica}
                </p>
              </div>
            `);
          }
        }).addTo(map);
      });
  });
</script>

</body>
</html>
