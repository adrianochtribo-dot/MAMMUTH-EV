name: PR Management — MAMMUTH EV

on:
  pull_request:
    types: [opened, edited, review_requested, ready_for_review]

jobs:
  label-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Label — Review Needed
        if: github.event.action == 'review_requested'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['review-needed']
            })

      - name: Label — Work In Progress
        if: contains(github.event.pull_request.title, 'WIP') || contains(github.event.pull_request.title, 'wip')
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['wip']
            })

      - name: Label — Ready for Review
        if: github.event.action == 'ready_for_review'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['ready-for-review']
            })
