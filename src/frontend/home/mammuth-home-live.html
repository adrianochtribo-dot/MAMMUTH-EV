<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@300;400&display=swap');
* { box-sizing:border-box; margin:0; padding:0; font-family:'DM Sans',system-ui,sans-serif; }
body { background:#FAF8F5; max-width:430px; margin:0 auto; min-height:100vh; }
::-webkit-scrollbar{display:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<script>

// ============================================
// MAMMUTH•EVENTS™ — Home MVP LIVE
// Connessa a Supabase PostgreSQL + PostGIS
// ============================================

const SUPABASE_URL = 'https://pwfsuefyiiwnltikcdho.supabase.co';
const SUPABASE_KEY = 'sb_publishable_5sHvYKX3YL7RI_RwpJK9FQ_-A2G7H63';

const COLORI = {
  'Cultura':       { colore:'#70D6FF', bg:'#EEF9FF', emoji:'🏰' },
  'Enogastronomia':{ colore:'#FFB830', bg:'#FFF8EE', emoji:'🍷' },
  'Musica':        { colore:'#FF70A6', bg:'#FFF0F6', emoji:'🎵' },
  'Sagra':         { colore:'#B5EAD7', bg:'#EEFAF5', emoji:'🌾' },
  'Religioso':     { colore:'#C9B1FF', bg:'#F5EEFF', emoji:'⛪' },
};

const FILTRI = ['Tutti','Cultura','Enogastronomia','Musica','Sagra','Religioso'];

let eventi = [];
let filtro = 'Tutti';
let cerca = '';
let loading = true;
let errore = null;

// ============================================
// FETCH EVENTI DA SUPABASE
// ============================================
async function fetchEventi() {
  try {
    loading = true;
    render();

    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/eventi?select=*&order=data_inizio.asc`,
      {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
        }
      }
    );

    if (!res.ok) throw new Error(`Errore API: ${res.status}`);
    
    eventi = await res.json();
    loading = false;
    errore = null;
    render();
  } catch(e) {
    loading = false;
    errore = e.message;
    render();
  }
}

// ============================================
// FILTRA EVENTI
// ============================================
function getEventiFiltrati() {
  return eventi.filter(e => {
    const matchCat = filtro === 'Tutti' || e.categoria === filtro;
    const matchSearch = cerca === '' ||
      e.titolo.toLowerCase().includes(cerca.toLowerCase()) ||
      e.luogo.toLowerCase().includes(cerca.toLowerCase()) ||
      (e.tags && e.tags.some(t => t.includes(cerca.toLowerCase())));
    return matchCat && matchSearch;
  });
}

// ============================================
// RENDER CARD EVENTO
// ============================================
function renderCard(evento, index) {
  const cat = COLORI[evento.categoria] || { colore:'#AAA', bg:'#F5F5F5', emoji:'📅' };
  const dataStr = new Date(evento.data_inizio).toLocaleDateString('it-IT', { day:'numeric', month:'short' });
  const oggi = new Date().toDateString() === new Date(evento.data_inizio).toDateString();
  const prezzo = evento.gratuito ? '🎉 FREE' : `Da €${evento.prezzo_min || '?'}`;
  const posti = evento.posti_disponibili;

  return `
    <div style="background:#FFF;border-radius:20px;overflow:hidden;border:1.5px solid #EDE8E0;
      box-shadow:3px 3px 0 #D8D4CC;cursor:pointer;animation:fadeUp 0.3s ease both;
      animation-delay:${index * 0.07}s"
      onmousedown="this.style.transform='translate(2px,2px)';this.style.boxShadow='1px 1px 0 #D8D4CC'"
      onmouseup="this.style.transform='';this.style.boxShadow='3px 3px 0 #D8D4CC'"
      onmouseleave="this.style.transform='';this.style.boxShadow='3px 3px 0 #D8D4CC'">
      
      <div style="height:4px;background:${cat.colore}"></div>
      <div style="padding:14px 16px 16px">
        
        <!-- Header -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div style="background:${cat.colore};color:#1A1A1E;border-radius:8px;padding:4px 12px;
            font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.04em">
            ${cat.emoji} ${evento.categoria}
          </div>
          <div style="background:${oggi?'#1A1A1E':'#F5F3EF'};color:${oggi?'#FFF':'#888'};
            border:1.5px solid ${oggi?'#1A1A1E':'#E8E4DC'};border-radius:8px;
            padding:3px 10px;font-size:11px;font-weight:700">
            ${oggi ? '🔴 Oggi' : dataStr} · ${evento.orario_inizio ? evento.orario_inizio.slice(0,5) : ''}
          </div>
        </div>

        <!-- Titolo -->
        <div style="font-size:17px;font-weight:800;color:#1A1A1E;line-height:1.25;
          margin-bottom:6px;letter-spacing:-0.02em">${evento.titolo}</div>

        <!-- Descrizione -->
        <div style="font-size:13px;color:#888;line-height:1.5;margin-bottom:12px">
          ${evento.descrizione ? evento.descrizione.substring(0,100) + '...' : ''}
        </div>

        <!-- FOMO posti -->
        ${posti && posti <= 15 ? `
          <div style="background:#FFF0F0;border:1.5px solid #FF6B6B;border-radius:20px;
            display:inline-block;padding:3px 10px;font-size:11px;font-weight:700;
            color:#CC3333;margin-bottom:10px">
            🔴 Solo ${posti} posti rimasti
          </div>
        ` : ''}

        <!-- Info + prezzo -->
        <div style="display:flex;justify-content:space-between;align-items:flex-end">
          <div>
            <div style="font-size:12px;color:#333;font-weight:600;margin-bottom:2px">
              📍 ${evento.luogo}
            </div>
            <div style="font-size:11px;color:#AAA">
              🚶 ${evento.indirizzo ? evento.indirizzo.split(',')[1] || 'Sermoneta' : 'Sermoneta'}
            </div>
          </div>
          <div style="background:${evento.gratuito?'#B5EAD7':cat.colore};color:#1A1A1E;
            border-radius:12px;padding:7px 16px;font-size:15px;font-weight:900;
            box-shadow:2px 2px 0 ${cat.colore}88">
            ${prezzo}
          </div>
        </div>

        <!-- Tags -->
        ${evento.tags ? `
          <div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap">
            ${evento.tags.map(t => `
              <span style="background:#F5F3EF;color:#999;border-radius:6px;
                padding:2px 8px;font-size:10px;font-weight:500">#${t}</span>
            `).join('')}
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

// ============================================
// RENDER PRINCIPALE
// ============================================
function render() {
  const filtrati = getEventiFiltrati();
  
  document.getElementById('app').innerHTML = `
    <div style="min-height:100vh;background:#FAF8F5">

      <!-- HEADER -->
      <div style="position:sticky;top:0;z-index:10;background:rgba(250,248,245,0.96);
        backdrop-filter:blur(16px);padding:48px 20px 16px;border-bottom:1.5px solid #EDE8E0">
        
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
          <div>
            <div style="font-size:9px;color:#B8B0A4;font-weight:600;letter-spacing:0.14em;
              text-transform:uppercase;margin-bottom:4px">Borghi · Valli · Sentieri</div>
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
              <span style="font-size:22px">🦣</span>
              <div style="display:flex;align-items:center">
                <span style="font-size:20px;font-weight:300;letter-spacing:0.16em;
                  color:#1A1A1E;text-transform:uppercase">MAMMUTH</span>
                <span style="width:6px;height:6px;background:#E8221A;border-radius:50%;
                  display:inline-block;margin:0 3px"></span>
                <span style="font-size:20px;font-weight:300;letter-spacing:0.16em;
                  color:#1A1A1E;text-transform:uppercase">EV</span>
              </div>
            </div>
            <div style="height:1px;background:#D8D4CC;margin-bottom:5px"></div>
            <div style="font-size:12px;font-weight:700;color:#1A1A1E;margin-bottom:2px">
              Il territorio come non l'hai mai visto.
            </div>
            <div style="font-size:9px;font-family:'DM Mono',monospace;font-weight:300;
              letter-spacing:0.16em;color:#B8B0A4;text-transform:uppercase">
              Where Communities Come Alive™
            </div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-top:20px">
            <div style="background:#E8221A;color:#FFF;border-radius:10px;
              padding:5px 11px;font-size:11px;font-weight:700">
              ${loading ? '...' : filtrati.length} eventi
            </div>
            ${!loading && !errore ? `
              <div style="font-size:8px;font-family:'DM Mono',monospace;color:#B5EAD7;
                letter-spacing:0.08em">● LIVE</div>
            ` : ''}
          </div>
        </div>

        <!-- Search -->
        <div style="background:#FFF;border:1.5px solid #EDE8E0;border-radius:13px;
          padding:10px 16px;display:flex;align-items:center;gap:8px;
          margin-bottom:14px;box-shadow:2px 2px 0 #D8D4CC">
          <span style="font-size:14px;color:#C0BCB4">🔍</span>
          <input id="search-input" value="${cerca}"
            placeholder="Cosa succede oggi intorno a te..."
            oninput="cerca=this.value;render()"
            style="background:transparent;border:none;color:#1A1A1E;
              font-size:14px;width:100%;font-family:inherit"/>
        </div>

        <!-- Filtri -->
        <div style="display:flex;gap:7px;overflow-x:auto;padding-bottom:2px">
          ${FILTRI.map(f => `
            <button onclick="filtro='${f}';render()" style="
              background:${filtro===f?'#1A1A1E':'#FFF'};
              color:${filtro===f?'#FFF':'#888'};
              border:1.5px solid ${filtro===f?'#1A1A1E':'#EDE8E0'};
              border-radius:20px;padding:6px 14px;font-size:11px;
              font-weight:${filtro===f?700:400};cursor:pointer;
              white-space:nowrap;font-family:inherit;transition:all 0.12s ease">
              ${f}
            </button>
          `).join('')}
        </div>
      </div>

      <!-- CONTENUTO -->
      <div style="padding:20px 20px 60px;display:flex;flex-direction:column;gap:14px">

        ${loading ? `
          <div style="display:flex;flex-direction:column;align-items:center;
            justify-content:center;padding:60px 20px;gap:16px">
            <div style="width:32px;height:32px;border:3px solid #EDE8E0;
              border-top-color:#E8221A;border-radius:50%;
              animation:spin 0.8s linear infinite"></div>
            <div style="font-size:12px;font-family:'DM Mono',monospace;
              color:#B8B0A4;letter-spacing:0.1em;text-transform:uppercase">
              Caricamento eventi...
            </div>
          </div>
        ` : errore ? `
          <div style="background:#FFF0F0;border:1.5px solid #FFB3B3;border-radius:14px;
            padding:20px;text-align:center">
            <div style="font-size:24px;margin-bottom:8px">⚠️</div>
            <div style="font-size:13px;font-weight:700;color:#CC3333;margin-bottom:4px">
              Errore connessione database
            </div>
            <div style="font-size:11px;color:#AAA">${errore}</div>
            <button onclick="fetchEventi()" style="margin-top:12px;background:#E8221A;
              color:#FFF;border:none;border-radius:10px;padding:8px 16px;
              font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">
              Riprova
            </button>
          </div>
        ` : filtrati.length === 0 ? `
          <div style="text-align:center;padding:60px 20px;color:#C8C0B4;font-size:15px">
            Nessuna esperienza trovata
          </div>
        ` : `
          <div style="font-size:10px;font-family:'DM Mono',monospace;color:#B8B0A4;
            font-weight:300;letter-spacing:0.1em;text-transform:uppercase">
            Quello che i locali amano davvero · ${filtrati.length} esperienze
          </div>
          ${filtrati.map((e,i) => renderCard(e,i)).join('')}
        `}
      </div>

      <!-- FOOTER -->
      <div style="background:#1A1A1E;padding:28px 20px;display:flex;
        flex-direction:column;gap:16px">
        <div style="font-size:16px;font-weight:800;color:#FFF;letter-spacing:-0.02em;line-height:1.3">
          Piccoli comuni.<br><span style="color:#C8A96E">Storie enormi.</span>
        </div>
        <div style="font-size:8px;font-family:'DM Mono',monospace;color:#3A3028;
          letter-spacing:0.1em;text-transform:uppercase;text-align:center">
          KREATIO UNIVERSAL SYSTEM™ · CODE 3620 · ATLAS•EVENTA™<br>
          Database: Supabase PostgreSQL + PostGIS · eu-west-1
        </div>
      </div>
    </div>
  `;
}

// ============================================
// INIT
// ============================================
fetchEventi();
</script>
</body>
</html>
