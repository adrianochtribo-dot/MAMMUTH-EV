<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@300;400&display=swap');
* { box-sizing:border-box; margin:0; padding:0; font-family:'DM Sans',system-ui,sans-serif; }
body { background:#FAF8F5; max-width:430px; margin:0 auto; min-height:100vh; }
::-webkit-scrollbar { display:none; }
@keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideIn { from{transform:translateX(100%)} to{transform:translateX(0)} }
</style>
</head>
<body>
<div id="app"></div>
<script>

const eventi = [
  {
    id:"1",
    titolo:"Festa del Cammeo e dei Borghi",
    sottotitolo:"L'artigianato che ha fatto la storia di Sermoneta",
    data:"Oggi — Domenica 7 Giugno 2026",
    orario:"18:00 — 23:00",
    luogo:"Castello Caetani",
    indirizzo:"Piazza del Castello, Sermoneta (LT)",
    categoria:"Cultura",
    colore:"#70D6FF",
    gratuito:true,
    distanza:"0.3 km",
    walkMin:"4 min a piedi dal parcheggio",
    posti:8,
    postiTotali:50,
    descrizione:"La Festa del Cammeo è il cuore pulsante di Sermoneta. Ogni anno, artigiani locali aprono le loro botteghe e portano in piazza le tecniche tramandate di generazione in generazione. Il cammeo di Sermoneta è riconosciuto a livello internazionale per la sua finezza e per l'uso di materiali locali.",
    descrizione2:"Un'esperienza unica: potrai assistere dal vivo alla lavorazione del cammeo, incontrare i maestri artigiani e acquistare pezzi originali certificati. L'atmosfera medievale del borgo amplifica ogni sensazione.",
    organizzatore:"Pro Loco Sermoneta",
    organizzatoreAnni:42,
    badge:"🧑‍🎨 Gestito da un locale",
    badgeColor:"#B5EAD7",
    fomo:[
      { label:"🔴 Ultimi 8 posti", color:"#70D6FF", bg:"#EEF9FF" },
      { label:"⚡ Evento unico dell'anno", color:"#FFB830", bg:"#FFF8EE" },
      { label:"🌟 Patrocinio Comune di Sermoneta", color:"#B5EAD7", bg:"#EEFAF5" },
    ],
    tag:["borgo","artigianato","cammeo","tradizione"],
    programma:[
      { ora:"18:00", desc:"Apertura botteghe artigiane" },
      { ora:"19:30", desc:"Dimostrazione lavorazione cammeo" },
      { ora:"21:00", desc:"Mercato serale — acquisti diretti" },
      { ora:"22:30", desc:"Chiusura e saluti" },
    ],
    comeArrivare:"Da Roma: A1 uscita Frosinone, poi SS156 direzione Sermoneta. Parcheggio gratuito in Piazza della Repubblica.",
    accessibilita:"✅ Accessibile con sedia a rotelle",
  },
  {
    id:"2",
    titolo:"Degustazione Vini nei Vicoli",
    sottotitolo:"I migliori vini DOC della Provincia di Latina",
    data:"Venerdì 20 Giugno 2026",
    orario:"20:30 — 23:30",
    luogo:"Loggia dei Mercanti",
    indirizzo:"Via della Loggia 3, Sermoneta (LT)",
    categoria:"Enogastronomia",
    colore:"#FFB830",
    gratuito:false,
    prezzo:"€12",
    distanza:"0.4 km",
    walkMin:"2 min a piedi dal parcheggio",
    posti:3,
    postiTotali:30,
    descrizione:"Un percorso sensoriale tra i migliori vini DOC Pontino. Sei produttori locali presenteranno le loro etichette più pregiate accompagnate da prodotti tipici del territorio lepino.",
    descrizione2:"Ogni produttore racconta la storia della sua vigna, le tecniche di vinificazione e il legame profondo con la terra di Sermoneta. Non è solo una degustazione — è un viaggio.",
    organizzatore:"Consorzio Vini Pontini",
    organizzatoreAnni:15,
    badge:"🧑‍🌾 Nativo di Sermoneta",
    badgeColor:"#FFD670",
    fomo:[
      { label:"🔴 Solo 3 posti rimasti", color:"#FF6B6B", bg:"#FFF0F0" },
      { label:"🍷 6 produttori DOC", color:"#FFB830", bg:"#FFF8EE" },
    ],
    tag:["vino","DOC","degustazione","pontino"],
    programma:[
      { ora:"20:30", desc:"Accoglienza e benvenuto" },
      { ora:"21:00", desc:"Prima sessione — vini bianchi" },
      { ora:"21:45", desc:"Seconda sessione — vini rossi" },
      { ora:"22:30", desc:"Abbinamenti con formaggi locali" },
    ],
    comeArrivare:"Centro storico di Sermoneta — parcheggio in Piazza della Repubblica (2 min a piedi).",
    accessibilita:"⚠️ Scalini all'ingresso — contattare organizzatore",
  },
];

let eventoCorrente = eventi[0];
let vistaCorrente = 'lista'; // 'lista' o 'dettaglio'

function renderLista() {
  return `
    <div style="padding:52px 20px 80px;animation:fadeUp 0.3s ease">

      <!-- Header -->
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:24px">
        <span style="font-size:20px">🦣</span>
        <span style="font-size:18px;font-weight:300;letter-spacing:0.16em;color:#1A1A1E;text-transform:uppercase">MAMMUTH</span>
        <span style="width:5px;height:5px;background:#E8221A;border-radius:50%;display:inline-block;margin:0 2px"></span>
        <span style="font-size:18px;font-weight:300;letter-spacing:0.16em;color:#1A1A1E;text-transform:uppercase">EV</span>
      </div>

      <div style="font-size:10px;font-family:'DM Mono',monospace;color:#B8B0A4;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:16px">
        Quello che i locali amano davvero · ${eventi.length} esperienze
      </div>

      <!-- Cards -->
      ${eventi.map(e => `
        <div onclick="apriDettaglio('${e.id}')" style="background:#FFF;border-radius:20px;overflow:hidden;border:1.5px solid #EDE8E0;box-shadow:3px 3px 0 #D8D4CC;cursor:pointer;margin-bottom:14px;transition:all 0.1s ease"
          onmousedown="this.style.transform='translate(2px,2px)';this.style.boxShadow='1px 1px 0 #D8D4CC'"
          onmouseup="this.style.transform='';this.style.boxShadow='3px 3px 0 #D8D4CC'"
          onmouseleave="this.style.transform='';this.style.boxShadow='3px 3px 0 #D8D4CC'">
          <div style="height:4px;background:${e.colore}"></div>
          <div style="padding:14px 16px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
              <div style="background:${e.colore};color:#1A1A1E;border-radius:8px;padding:4px 12px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.04em">${e.categoria}</div>
              <div style="background:${e.data.startsWith('Oggi')?'#1A1A1E':'#F5F3EF'};color:${e.data.startsWith('Oggi')?'#FFF':'#888'};border:1.5px solid ${e.data.startsWith('Oggi')?'#1A1A1E':'#E8E4DC'};border-radius:8px;padding:3px 10px;font-size:11px;font-weight:700">
                ${e.data.startsWith('Oggi')?'🔴 Oggi':e.data.split(' ').slice(1,4).join(' ')} · ${e.orario.split('—')[0].trim()}
              </div>
            </div>
            <div style="font-size:17px;font-weight:800;color:#1A1A1E;line-height:1.25;margin-bottom:6px;letter-spacing:-0.02em">${e.titolo}</div>
            <div style="font-size:13px;color:#888;line-height:1.5;margin-bottom:12px">${e.descrizione.substring(0,80)}...</div>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div style="font-size:12px;color:#333;font-weight:600">📍 ${e.luogo}</div>
              <div style="background:${e.gratuito?'#B5EAD7':e.colore};color:#1A1A1E;border-radius:10px;padding:5px 14px;font-size:14px;font-weight:900">
                ${e.gratuito?'🎉 FREE':`Da ${e.prezzo}`}
              </div>
            </div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderDettaglio(evento) {
  const postiPct = ((evento.postiTotali - evento.posti) / evento.postiTotali) * 100;
  return `
    <div style="animation:slideIn 0.25s ease">

      <!-- Hero colorato -->
      <div style="background:${evento.colore}22;padding:52px 20px 24px;border-bottom:2px solid ${evento.colore}44;position:relative">
        <!-- Back button -->
        <button onclick="tornaLista()" style="display:flex;align-items:center;gap:6px;background:#FFF;border:1.5px solid #EDE8E0;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;color:#1A1A1E;cursor:pointer;margin-bottom:20px;font-family:inherit">
          ← Torna agli eventi
        </button>

        <!-- Categoria badge -->
        <div style="display:inline-block;background:${evento.colore};color:#1A1A1E;border-radius:8px;padding:4px 14px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px">
          ${evento.categoria}
        </div>

        <!-- Titolo -->
        <div style="font-size:24px;font-weight:800;color:#1A1A1E;line-height:1.2;margin-bottom:6px;letter-spacing:-0.02em">
          ${evento.titolo}
        </div>
        <div style="font-size:14px;color:#666;margin-bottom:16px">${evento.sottotitolo}</div>

        <!-- Info rapide -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          ${[
            {icon:'📅',label:'Data',val:evento.data},
            {icon:'🕐',label:'Orario',val:evento.orario},
            {icon:'📍',label:'Luogo',val:evento.luogo},
            {icon:'🚶',label:'A piedi',val:evento.walkMin},
          ].map(item=>`
            <div style="background:#FFF;border-radius:12px;padding:10px 12px;border:1px solid ${evento.colore}44">
              <div style="font-size:9px;color:#AAA;font-family:'DM Mono',monospace;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:3px">${item.icon} ${item.label}</div>
              <div style="font-size:12px;font-weight:600;color:#1A1A1E;line-height:1.3">${item.val}</div>
            </div>
          `).join('')}
        </div>
      </div>

      <!-- Contenuto scrollabile -->
      <div style="padding:20px 20px 120px">

        <!-- FOMO badges -->
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px">
          ${evento.fomo.map(f=>`
            <div style="background:${f.bg};border:1.5px solid ${f.color};border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;color:#1A1A1E">
              ${f.label}
            </div>
          `).join('')}
        </div>

        <!-- Posti rimasti — barra -->
        <div style="background:#FFF;border:1.5px solid #EDE8E0;border-radius:14px;padding:14px 16px;margin-bottom:20px">
          <div style="display:flex;justify-content:space-between;margin-bottom:8px">
            <span style="font-size:12px;font-weight:700;color:#1A1A1E">Posti disponibili</span>
            <span style="font-size:12px;font-weight:800;color:${evento.posti<=5?'#E8221A':evento.colore}">${evento.posti} rimasti su ${evento.postiTotali}</span>
          </div>
          <div style="height:8px;background:#F0EDE8;border-radius:4px;overflow:hidden">
            <div style="height:100%;width:${postiPct}%;background:${evento.posti<=5?'#E8221A':evento.colore};border-radius:4px;transition:width 0.6s ease"></div>
          </div>
        </div>

        <!-- Descrizione -->
        <div style="margin-bottom:20px">
          <div style="font-size:13px;font-weight:800;color:#1A1A1E;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:10px">L'esperienza</div>
          <div style="font-size:14px;color:#444;line-height:1.7;margin-bottom:10px">${evento.descrizione}</div>
          <div style="font-size:14px;color:#666;line-height:1.7">${evento.descrizione2}</div>
        </div>

        <!-- Programma -->
        <div style="margin-bottom:20px">
          <div style="font-size:13px;font-weight:800;color:#1A1A1E;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:12px">Programma</div>
          ${evento.programma.map((p,i)=>`
            <div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:12px">
              <div style="background:${evento.colore};color:#1A1A1E;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:800;white-space:nowrap;flex-shrink:0">${p.ora}</div>
              <div style="font-size:13px;color:#555;line-height:1.5;padding-top:4px">${p.desc}</div>
            </div>
          `).join('')}
        </div>

        <!-- Organizzatore -->
        <div style="background:#FFF;border:1.5px solid ${evento.badgeColor};border-radius:14px;padding:14px 16px;margin-bottom:20px">
          <div style="font-size:9px;font-family:'DM Mono',monospace;color:#AAA;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:8px">Organizzatore</div>
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:40px;height:40px;background:${evento.badgeColor}44;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">🤝</div>
            <div>
              <div style="font-size:14px;font-weight:700;color:#1A1A1E">${evento.organizzatore}</div>
              <div style="font-size:11px;color:#888">Organizza eventi locali da ${evento.organizzatoreAnni} anni</div>
            </div>
          </div>
        </div>

        <!-- Come arrivare -->
        <div style="background:#FFF;border:1.5px solid #EDE8E0;border-radius:14px;padding:14px 16px;margin-bottom:20px">
          <div style="font-size:9px;font-family:'DM Mono',monospace;color:#AAA;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:8px">Come arrivare</div>
          <div style="font-size:13px;color:#555;line-height:1.6">${evento.comeArrivare}</div>
          <div style="font-size:11px;color:#AAA;margin-top:8px">${evento.accessibilita}</div>
        </div>

        <!-- Tag -->
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${evento.tag.map(t=>`
            <span style="background:#F5F3EF;color:#999;border-radius:6px;padding:3px 9px;font-size:11px;font-weight:500">#${t}</span>
          `).join('')}
        </div>
      </div>

      <!-- CTA sticky -->
      <div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(250,248,245,0.97);backdrop-filter:blur(16px);border-top:1.5px solid #EDE8E0;padding:16px 20px 32px;z-index:50">
        <div style="display:flex;gap:10px">
          <!-- Salva -->
          <button style="width:52px;height:52px;background:#FFF;border:1.5px solid #EDE8E0;border-radius:14px;font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center">
            🔖
          </button>
          <!-- Prenota / Partecipa -->
          <button style="flex:1;background:${evento.gratuito?'#1A1A1E':evento.colore};color:${evento.gratuito?'#FFF':'#1A1A1E'};border:none;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;padding:0 20px;box-shadow:3px 3px 0 ${evento.gratuito?'#000000AA':evento.colore+'88'}">
            ${evento.gratuito?'🎉 Partecipa gratis':'🎟️ Prenota — '+evento.prezzo}
          </button>
          <!-- Condividi -->
          <button style="width:52px;height:52px;background:#FFF;border:1.5px solid #EDE8E0;border-radius:14px;font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center">
            📤
          </button>
        </div>
        <div style="text-align:center;margin-top:10px;font-size:10px;font-family:'DM Mono',monospace;color:#C0BCB4;letter-spacing:0.1em;text-transform:uppercase">
          Vivi il territorio · Prenota in 30 secondi
        </div>
      </div>
    </div>
  `;
}

function render() {
  document.getElementById('app').innerHTML = vistaCorrente === 'lista'
    ? renderLista()
    : renderDettaglio(eventoCorrente);
}

function apriDettaglio(id) {
  eventoCorrente = eventi.find(e => e.id === id);
  vistaCorrente = 'dettaglio';
  window.scrollTo(0,0);
  render();
}

function tornaLista() {
  vistaCorrente = 'lista';
  window.scrollTo(0,0);
  render();
}

render();
</script>
</body>
</html>
