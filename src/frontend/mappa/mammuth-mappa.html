<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@300;400&display=swap');
* { box-sizing:border-box; margin:0; padding:0; font-family:'DM Sans',system-ui,sans-serif; }
body { background:#FAF8F5; max-width:430px; margin:0 auto; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
::-webkit-scrollbar { display:none; }

#mappa { flex:1; z-index:1; }

/* Override Leaflet tiles per look più pulito */
.leaflet-tile { filter: saturate(0.8) brightness(1.05); }

@keyframes slideUp { from{transform:translateY(100%);opacity:0} to{transform:translateY(0);opacity:1} }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

.pin-custom {
  width: 36px;
  height: 36px;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  border: 3px solid #FFF;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  cursor: pointer;
}

.leaflet-popup-content-wrapper {
  border-radius: 16px !important;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15) !important;
  border: none !important;
  padding: 0 !important;
}
.leaflet-popup-content { margin: 0 !important; }
.leaflet-popup-tip { display: none; }
</style>
</head>
<body>

<!-- HEADER -->
<div style="background:rgba(250,248,245,0.97);backdrop-filter:blur(16px);padding:52px 20px 14px;border-bottom:1.5px solid #EDE8E0;z-index:100;position:relative">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div>
      <div style="font-size:9px;color:#B8B0A4;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:4px">
        Borghi · Valli · Sentieri
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:18px">🦣</span>
        <span style="font-size:17px;font-weight:300;letter-spacing:0.16em;color:#1A1A1E;text-transform:uppercase">MAMMUTH</span>
        <span style="width:5px;height:5px;background:#E8221A;border-radius:50%;display:inline-block;margin:0 2px"></span>
        <span style="font-size:17px;font-weight:300;letter-spacing:0.16em;color:#1A1A1E;text-transform:uppercase">EV</span>
      </div>
    </div>
    <!-- Counter eventi -->
    <div style="background:#E8221A;color:#FFF;border-radius:10px;padding:5px 11px;font-size:11px;font-weight:700">
      5 eventi
    </div>
  </div>

  <!-- Tab mappa/lista -->
  <div style="display:flex;gap:8px;margin-top:12px">
    <button id="btn-mappa" onclick="setVista('mappa')" style="flex:1;background:#1A1A1E;color:#FFF;border:none;border-radius:20px;padding:7px 0;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.15s ease">
      🗺️ Mappa
    </button>
    <button id="btn-lista" onclick="setVista('lista')" style="flex:1;background:#FFF;color:#888;border:1.5px solid #EDE8E0;border-radius:20px;padding:7px 0;font-size:11px;font-weight:500;cursor:pointer;font-family:inherit;transition:all 0.15s ease">
      ☰ Lista
    </button>
  </div>
</div>

<!-- MAPPA -->
<div id="mappa"></div>

<!-- LISTA EVENTI (nascosta di default) -->
<div id="lista-eventi" style="display:none;overflow-y:auto;flex:1;padding:16px 20px 80px;background:#FAF8F5"></div>

<!-- CARD EVENTO (bottom sheet) -->
<div id="card-evento" style="display:none;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:1000;padding:0 0 20px"></div>

<!-- BOTTOM NAV -->
<div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(250,248,245,0.97);backdrop-filter:blur(16px);border-top:1.5px solid #EDE8E0;display:flex;padding:12px 0 24px;z-index:200">
  <div onclick="window.location='../home/mammuth-home-mvp.jsx'" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer">
    <div style="font-size:20px">🏠</div>
    <div style="font-size:9px;font-weight:400;color:#AAA">Home</div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer">
    <div style="font-size:20px">🗺️</div>
    <div style="font-size:9px;font-weight:800;color:#1A1A1E">Mappa</div>
    <div style="width:20px;height:3px;background:#1A1A1E;border-radius:2px"></div>
  </div>
  <div onclick="window.location='../passaporto/mammuth-passaporto.html'" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer">
    <div style="font-size:20px">📖</div>
    <div style="font-size:9px;font-weight:400;color:#AAA">Passaporto</div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer">
    <div style="font-size:20px">👤</div>
    <div style="font-size:9px;font-weight:400;color:#AAA">Profilo</div>
  </div>
</div>

<script>
const eventi = [
  {
    id:1, titolo:"Festa del Cammeo e dei Borghi",
    categoria:"Cultura", colore:"#70D6FF",
    data:"Oggi", orario:"18:00",
    luogo:"Castello Caetani",
    gratuito:true,
    posti:8,
    lat:41.5513, lng:12.9851,
    descrizione:"Mostra mercato del cammeo con artigiani locali nel borgo medievale.",
    fomo:"🔴 Ultimi 8 posti",
    walkMin:"4 min a piedi",
    emoji:"🏰"
  },
  {
    id:2, titolo:"Degustazione Vini nei Vicoli",
    categoria:"Enogastronomia", colore:"#FFB830",
    data:"20 Giu", orario:"20:30",
    luogo:"Loggia dei Mercanti",
    gratuito:false, prezzo:"€12",
    posti:3,
    lat:41.5520, lng:12.9842,
    descrizione:"Selezione di vini DOC Pontino con produttori della Provincia di Latina.",
    fomo:"🔴 Solo 3 posti",
    walkMin:"2 min a piedi",
    emoji:"🍷"
  },
  {
    id:3, titolo:"Concerto di Mezza Estate",
    categoria:"Musica", colore:"#FF70A6",
    data:"24 Giu", orario:"21:00",
    luogo:"Piazza del Comune",
    gratuito:true,
    posti:40,
    lat:41.5508, lng:12.9838,
    descrizione:"Orchestra da camera sotto le stelle nel cuore del borgo.",
    fomo:"⚡ Sold out l'anno scorso",
    walkMin:"1 min a piedi",
    emoji:"🎵"
  },
  {
    id:4, titolo:"Sagra della Zuppa di Farro",
    categoria:"Sagra", colore:"#B5EAD7",
    data:"5 Lug", orario:"19:30",
    luogo:"Contrada Valle",
    gratuito:false, prezzo:"€8",
    posti:25,
    lat:41.5490, lng:12.9820,
    descrizione:"Piatto simbolo della tradizione contadina lepina.",
    fomo:"🌾 Ricetta dal 1962",
    walkMin:"8 min a piedi",
    emoji:"🌾"
  },
  {
    id:5, titolo:"Visita Abbazia di Valvisciolo",
    categoria:"Religioso", colore:"#C9B1FF",
    data:"12 Lug", orario:"10:00",
    luogo:"Abbazia di Valvisciolo",
    gratuito:false, prezzo:"€5",
    posti:12,
    lat:41.5560, lng:12.9780,
    descrizione:"Tour guidato dell'abbazia cistercense del XIII secolo.",
    fomo:"🔴 Solo 12 posti",
    walkMin:"3.1 km in auto",
    emoji:"⛪"
  },
];

let mappa;
let vistaCorrente = 'mappa';

function initMappa() {
  mappa = L.map('mappa', {
    center: [41.5513, 12.9838],
    zoom: 15,
    zoomControl: false,
    attributionControl: false,
  });

  // Tiles OpenStreetMap
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
  }).addTo(mappa);

  // Aggiungi pin per ogni evento
  eventi.forEach(e => {
    const iconHtml = `
      <div style="
        width:42px;height:42px;
        background:${e.colore};
        border-radius:50% 50% 50% 0;
        transform:rotate(-45deg);
        border:3px solid #FFF;
        box-shadow:0 3px 10px rgba(0,0,0,0.2);
        display:flex;align-items:center;justify-content:center;
      ">
        <span style="transform:rotate(45deg);font-size:18px">${e.emoji}</span>
      </div>
    `;

    const icon = L.divIcon({
      html: iconHtml,
      className: '',
      iconSize: [42, 42],
      iconAnchor: [21, 42],
    });

    const marker = L.marker([e.lat, e.lng], { icon }).addTo(mappa);
    marker.on('click', () => mostraCard(e));
  });

  // Cerchio area Sermoneta
  L.circle([41.5513, 12.9838], {
    color: '#E8221A',
    fillColor: '#E8221A',
    fillOpacity: 0.04,
    weight: 1,
    dashArray: '4',
    radius: 400,
  }).addTo(mappa);
}

function mostraCard(evento) {
  const card = document.getElementById('card-evento');
  card.style.display = 'block';
  card.innerHTML = `
    <div style="background:#FAF8F5;border-radius:24px 24px 0 0;padding:20px 20px 16px;box-shadow:0 -8px 32px rgba(0,0,0,0.12);animation:slideUp 0.2s ease;border-top:3px solid ${evento.colore}">
      <!-- Handle -->
      <div style="width:36px;height:4px;background:#D8D4CC;border-radius:2px;margin:0 auto 16px"></div>

      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
        <div>
          <div style="display:inline-block;background:${evento.colore};color:#1A1A1E;border-radius:6px;padding:3px 10px;font-size:10px;font-weight:800;text-transform:uppercase;margin-bottom:6px">
            ${evento.categoria}
          </div>
          <div style="font-size:16px;font-weight:800;color:#1A1A1E;line-height:1.2;max-width:240px">${evento.titolo}</div>
        </div>
        <button onclick="chiudiCard()" style="width:32px;height:32px;background:#F5F3EF;border:none;border-radius:50%;font-size:14px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center">✕</button>
      </div>

      <div style="font-size:12px;color:#888;margin-bottom:12px">${evento.descrizione}</div>

      <!-- FOMO -->
      <div style="background:${evento.colore}22;border:1px solid ${evento.colore};border-radius:20px;display:inline-block;padding:3px 10px;font-size:11px;font-weight:700;color:#1A1A1E;margin-bottom:12px">
        ${evento.fomo}
      </div>

      <!-- Info row -->
      <div style="display:flex;gap:8px;margin-bottom:16px">
        <div style="background:#FFF;border:1px solid #EDE8E0;border-radius:10px;padding:8px 10px;flex:1;text-align:center">
          <div style="font-size:9px;color:#AAA;font-family:'DM Mono',monospace;text-transform:uppercase;margin-bottom:2px">📅 Data</div>
          <div style="font-size:11px;font-weight:700;color:#1A1A1E">${evento.data}</div>
        </div>
        <div style="background:#FFF;border:1px solid #EDE8E0;border-radius:10px;padding:8px 10px;flex:1;text-align:center">
          <div style="font-size:9px;color:#AAA;font-family:'DM Mono',monospace;text-transform:uppercase;margin-bottom:2px">🕐 Ora</div>
          <div style="font-size:11px;font-weight:700;color:#1A1A1E">${evento.orario}</div>
        </div>
        <div style="background:#FFF;border:1px solid #EDE8E0;border-radius:10px;padding:8px 10px;flex:1;text-align:center">
          <div style="font-size:9px;color:#AAA;font-family:'DM Mono',monospace;text-transform:uppercase;margin-bottom:2px">🚶 Distanza</div>
          <div style="font-size:11px;font-weight:700;color:#1A1A1E">${evento.walkMin}</div>
        </div>
      </div>

      <!-- CTA -->
      <div style="display:flex;gap:8px">
        <button style="flex:1;background:${evento.gratuito?'#1A1A1E':evento.colore};color:${evento.gratuito?'#FFF':'#1A1A1E'};border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit">
          ${evento.gratuito?'🎉 Partecipa gratis':'🎟️ Prenota — '+evento.prezzo}
        </button>
        <button onclick="chiudiCard()" style="width:48px;background:#FFF;border:1.5px solid #EDE8E0;border-radius:12px;font-size:18px;cursor:pointer">
          📤
        </button>
      </div>
    </div>
  `;

  // Centra mappa sull'evento
  mappa.setView([evento.lat, evento.lng], 16, { animate: true });
}

function chiudiCard() {
  document.getElementById('card-evento').style.display = 'none';
}

function setVista(vista) {
  vistaCorrente = vista;
  const btnMappa = document.getElementById('btn-mappa');
  const btnLista = document.getElementById('btn-lista');
  const mappaEl = document.getElementById('mappa');
  const listaEl = document.getElementById('lista-eventi');

  if (vista === 'mappa') {
    btnMappa.style.background = '#1A1A1E';
    btnMappa.style.color = '#FFF';
    btnLista.style.background = '#FFF';
    btnLista.style.color = '#888';
    mappaEl.style.display = 'block';
    listaEl.style.display = 'none';
    setTimeout(() => mappa.invalidateSize(), 100);
  } else {
    btnLista.style.background = '#1A1A1E';
    btnLista.style.color = '#FFF';
    btnMappa.style.background = '#FFF';
    btnMappa.style.color = '#888';
    mappaEl.style.display = 'none';
    listaEl.style.display = 'block';
    renderListaEventi();
  }
}

function renderListaEventi() {
  const lista = document.getElementById('lista-eventi');
  lista.innerHTML = `
    <div style="font-size:10px;font-family:'DM Mono',monospace;color:#B8B0A4;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:14px">
      ${eventi.length} eventi vicino a te · Sermoneta
    </div>
    ${eventi.map(e => `
      <div onclick='mostraCard(${JSON.stringify(e).replace(/'/g, "\\'")})'
        style="background:#FFF;border-radius:16px;overflow:hidden;border:1.5px solid #EDE8E0;box-shadow:3px 3px 0 #D8D4CC;cursor:pointer;margin-bottom:12px">
        <div style="height:3px;background:${e.colore}"></div>
        <div style="padding:12px 14px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <div style="background:${e.colore};color:#1A1A1E;border-radius:6px;padding:3px 10px;font-size:10px;font-weight:800;text-transform:uppercase">${e.categoria}</div>
            <div style="font-size:10px;color:#888;font-weight:600">${e.data} · ${e.orario}</div>
          </div>
          <div style="font-size:15px;font-weight:800;color:#1A1A1E;margin-bottom:4px;letter-spacing:-0.01em">${e.titolo}</div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
            <div style="font-size:11px;color:#888">📍 ${e.luogo} · ${e.walkMin}</div>
            <div style="background:${e.gratuito?'#B5EAD7':e.colore};color:#1A1A1E;border-radius:8px;padding:4px 12px;font-size:12px;font-weight:800">
              ${e.gratuito?'FREE':e.prezzo}
            </div>
          </div>
        </div>
      </div>
    `).join('')}
  `;
}

// Init
window.addEventListener('load', initMappa);
</script>
</body>
</html>
