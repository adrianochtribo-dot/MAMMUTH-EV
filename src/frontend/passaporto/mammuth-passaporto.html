<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@300;400&family=IM+Fell+English:ital@0;1&display=swap');
* { box-sizing:border-box; margin:0; padding:0; font-family:'DM Sans',system-ui,sans-serif; }
body { background:#FAF8F5; max-width:430px; margin:0 auto; min-height:100vh; }
::-webkit-scrollbar{display:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
</style>
</head>
<body>
<div id="app"></div>
<script>

const TIMBRI = [
  { id:"t1", evento:"Festa del Cammeo", luogo:"Castello Caetani", data:"7 Giu 2026", categoria:"Cultura", colore:"#70D6FF", emoji:"🏰", sbloccato:true },
  { id:"t2", evento:"Degustazione Vini", luogo:"Loggia dei Mercanti", data:"20 Giu 2026", categoria:"Enogastronomia", colore:"#FFB830", emoji:"🍷", sbloccato:true },
  { id:"t3", evento:"Concerto Estate", luogo:"Piazza del Comune", data:"24 Giu 2026", categoria:"Musica", colore:"#FF70A6", emoji:"🎵", sbloccato:false },
  { id:"t4", evento:"Sagra del Farro", luogo:"Contrada Valle", data:"5 Lug 2026", categoria:"Sagra", colore:"#B5EAD7", emoji:"🌾", sbloccato:false },
  { id:"t5", evento:"Abbazia Valvisciolo", luogo:"Abbazia", data:"12 Lug 2026", categoria:"Religioso", colore:"#C9B1FF", emoji:"⛪", sbloccato:false },
  { id:"t6", evento:"Mercato Artigianato", luogo:"Piazza del Comune", data:"19 Lug 2026", categoria:"Artigianato", colore:"#E9FF70", emoji:"🎨", sbloccato:false },
];

let currentTab = 'timbri';
let modalTimbro = null;

const timbriSbloccati = TIMBRI.filter(t => t.sbloccato).length;
const totale = TIMBRI.length;
const pct = (timbriSbloccati / totale) * 100;

const titolo = timbriSbloccati === 0 ? "Peregrinus"
  : timbriSbloccati <= 2 ? "Explorator Borgi"
  : timbriSbloccati <= 4 ? "Custos Traditionis"
  : "Legenda Sermonetae";

const titoloColore = timbriSbloccati === 0 ? "#AAA"
  : timbriSbloccati <= 2 ? "#70D6FF"
  : timbriSbloccati <= 4 ? "#FFB830"
  : "#C9B1FF";

const sigillo = timbriSbloccati === 0 ? "◌"
  : timbriSbloccati <= 2 ? "◑"
  : timbriSbloccati <= 4 ? "●"
  : "✦";

function render() {
  document.getElementById('app').innerHTML = `
    <div style="padding-bottom:90px">

      <!-- HEADER -->
      <div style="background:#FAF8F5;padding:52px 20px 20px;border-bottom:1.5px solid #EDE8E0">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:20px">
          <span style="font-size:20px">🦣</span>
          <span style="font-size:18px;font-weight:300;letter-spacing:0.16em;color:#1A1A1E;text-transform:uppercase">MAMMUTH</span>
          <span style="width:5px;height:5px;background:#E8221A;border-radius:50%;display:inline-block;margin:0 2px"></span>
          <span style="font-size:18px;font-weight:300;letter-spacing:0.16em;color:#1A1A1E;text-transform:uppercase">EV</span>
        </div>

        <!-- HERO CODEX -->
        <div style="background:linear-gradient(135deg,#1A1A1E 0%,#2A2A24 100%);border-radius:20px;padding:28px 24px;color:#FFF;position:relative;overflow:hidden">
          <div style="position:absolute;top:-20px;right:-20px;width:120px;height:120px;background:#C9B1FF18;border-radius:50%"></div>
          <div style="position:absolute;bottom:-30px;right:40px;width:80px;height:80px;background:#FFB83018;border-radius:50%"></div>

          <div style="position:relative">
            <!-- Titolo Codex -->
            <div style="font-size:9px;font-family:'DM Mono',monospace;letter-spacing:0.28em;color:#5A5A54;text-transform:uppercase;margin-bottom:6px">
              CODEX ITINERIS™
            </div>
            <div style="font-size:20px;font-weight:800;letter-spacing:-0.02em;margin-bottom:4px">
              Il Codice del Viandante
            </div>

            <!-- Citazione -->
            <div style="font-family:'IM Fell English',Georgia,serif;font-style:italic;font-size:13px;color:#8A8A78;line-height:1.6;margin-bottom:20px;border-left:2px solid #3A3A2E;padding-left:12px">
              Where Communities Come Alive™
            </div>

            <!-- Titolo utente -->
            <div style="display:inline-flex;align-items:center;gap:8px;background:${titoloColore}22;border:1px solid ${titoloColore};border-radius:20px;padding:5px 14px;margin-bottom:20px">
              <span style="font-size:14px">${sigillo}</span>
              <span style="font-size:11px;font-weight:700;color:${titoloColore};font-family:'DM Mono',monospace;letter-spacing:0.06em">${titolo}</span>
            </div>

            <!-- Barra progresso -->
            <div style="margin-bottom:6px">
              <div style="display:flex;justify-content:space-between;margin-bottom:6px">
                <span style="font-size:11px;color:#AAA;font-family:'DM Mono',monospace">Sigilli raccolti</span>
                <span style="font-size:11px;font-weight:800;color:#FFF;font-family:'DM Mono',monospace">${timbriSbloccati} / ${totale}</span>
              </div>
              <div style="height:6px;background:#2A2A24;border-radius:3px;overflow:hidden">
                <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,${titoloColore},#FFB830);border-radius:3px"></div>
              </div>
            </div>

            <!-- Descrizione -->
            <div style="font-size:11px;color:#4A4A40;line-height:1.5;margin-top:12px">
              Ogni borgo ha una memoria. Ogni visita lascia un segno.<br>
              <span style="color:#3A3A30">Non è una raccolta punti. È una cronaca. La tua.</span>
            </div>
          </div>
        </div>
      </div>

      <!-- TAB -->
      <div style="display:flex;background:#FFF;border-bottom:1.5px solid #EDE8E0;padding:0 20px">
        <button onclick="switchTab('timbri')" style="flex:1;background:transparent;border:none;border-bottom:3px solid ${currentTab==='timbri'?'#1A1A1E':'transparent'};padding:14px 0;font-size:13px;font-weight:${currentTab==='timbri'?800:500};color:${currentTab==='timbri'?'#1A1A1E':'#AAA'};cursor:pointer;font-family:inherit">
          ✦ Sigilli
        </button>
        <button onclick="switchTab('titoli')" style="flex:1;background:transparent;border:none;border-bottom:3px solid ${currentTab==='titoli'?'#1A1A1E':'transparent'};padding:14px 0;font-size:13px;font-weight:${currentTab==='titoli'?800:500};color:${currentTab==='titoli'?'#1A1A1E':'#AAA'};cursor:pointer;font-family:inherit">
          📜 Titoli
        </button>
      </div>

      <!-- CONTENUTO -->
      <div style="padding:20px">
        ${currentTab === 'timbri' ? renderTimbri() : renderTitoli()}
      </div>
    </div>

    <!-- BOTTOM NAV -->
    <div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(250,248,245,0.97);backdrop-filter:blur(16px);border-top:1.5px solid #EDE8E0;display:flex;padding:12px 0 24px;z-index:50">
      ${[
        {emoji:'🏠',label:'Home',active:false},
        {emoji:'🗺️',label:'Mappa',active:false},
        {emoji:'📖',label:'Codex',active:true},
        {emoji:'👤',label:'Profilo',active:false},
      ].map(item=>`
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer">
          <div style="font-size:22px;${item.active?'animation:pulse 2s ease infinite':''}">${item.emoji}</div>
          <div style="font-size:9px;font-weight:${item.active?800:400};color:${item.active?'#1A1A1E':'#AAA'}">${item.label}</div>
          ${item.active?'<div style="width:20px;height:3px;background:#1A1A1E;border-radius:2px"></div>':''}
        </div>
      `).join('')}
    </div>

    <!-- MODAL -->
    ${modalTimbro ? renderModal(modalTimbro) : ''}
  `;
}

function renderTimbri() {
  return `
    <div style="font-size:10px;font-family:'DM Mono',monospace;color:#B8B0A4;font-weight:300;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:14px">
      Ogni sigillo è una memoria. Ogni memoria è reale.
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
      ${TIMBRI.map(t => `
        <div onclick="openModal('${t.id}')" style="background:${t.sbloccato ? t.colore+'22' : '#F5F3EF'};border:2px solid ${t.sbloccato ? t.colore : '#E8E4DC'};border-radius:16px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;opacity:${t.sbloccato?1:0.45};position:relative;transition:all 0.15s ease">
          <div style="font-size:28px;filter:${t.sbloccato?'none':'grayscale(1)'};line-height:1">${t.sbloccato?t.emoji:'◌'}</div>
          <div style="font-size:9px;font-weight:700;color:${t.sbloccato?t.colore:'#CCC'};text-transform:uppercase;letter-spacing:0.06em;text-align:center;line-height:1.2">${t.categoria}</div>
          ${t.sbloccato ? `<div style="font-size:8px;color:#AAA;font-family:monospace">${t.data.split(' ')[0]} ${t.data.split(' ')[1]}</div>` : ''}
          ${t.sbloccato ? `<div style="position:absolute;top:6px;right:6px;width:16px;height:16px;background:${t.colore};border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#FFF">✓</div>` : ''}
        </div>
      `).join('')}
    </div>
  `;
}

function renderTitoli() {
  const titoli = [
    { sigillo:"◌", titolo:"Peregrinus", condizione:"Primo passo nel territorio", soglia:0, colore:"#AAA" },
    { sigillo:"◑", titolo:"Explorator Borgi", condizione:"2 luoghi visitati", soglia:2, colore:"#70D6FF" },
    { sigillo:"●", titolo:"Custos Traditionis", condizione:"4 luoghi visitati", soglia:4, colore:"#FFB830" },
    { sigillo:"✦", titolo:"Legenda Sermonetae", condizione:"Tutti i luoghi del Codex", soglia:6, colore:"#C9B1FF" },
  ];

  return `
    <div style="font-size:10px;font-family:'DM Mono',monospace;color:#B8B0A4;font-weight:300;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:14px">
      I Titoli del Viandante
    </div>
    ${titoli.map(t => {
      const raggiunto = timbriSbloccati >= t.soglia;
      const corrente = titolo === t.titolo;
      return `
        <div style="background:${corrente?'#1A1A1E':raggiunto?'#FFF':'#F5F3EF'};border:1.5px solid ${corrente?'#1A1A1E':raggiunto?t.colore:'#E8E4DC'};border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:10px;opacity:${raggiunto?1:0.5}">
          <div style="font-size:28px;color:${t.colore};flex-shrink:0;width:36px;text-align:center">${t.sigillo}</div>
          <div style="flex:1">
            <div style="font-size:14px;font-weight:800;color:${corrente?'#FFF':raggiunto?'#1A1A1E':'#AAA'};margin-bottom:3px;font-family:'DM Mono',monospace;letter-spacing:0.04em">${t.titolo}</div>
            <div style="font-size:11px;color:${corrente?'#5A5A50':'#AAA'}">${t.condizione}</div>
          </div>
          ${corrente ? `<div style="background:${t.colore};color:#1A1A1E;border-radius:20px;padding:3px 10px;font-size:9px;font-weight:800;font-family:'DM Mono',monospace;text-transform:uppercase;flex-shrink:0">Attivo</div>` : ''}
        </div>
      `;
    }).join('')}

    <!-- Citazione finale -->
    <div style="margin-top:24px;padding:20px;background:#FFF;border:1.5px solid #EDE8E0;border-radius:14px;text-align:center">
      <div style="font-family:'IM Fell English',Georgia,serif;font-style:italic;font-size:14px;color:#666;line-height:1.7;margin-bottom:10px">
        "Ogni sigillo è una memoria.<br>Ogni memoria è reale."
      </div>
      <div style="font-size:8px;font-family:'DM Mono',monospace;color:#CCC;letter-spacing:0.14em;text-transform:uppercase">
        CODEX ITINERIS™ · MAMMUTH•EVENTS™ · ANNO DOMINI MMXXVI
      </div>
    </div>
  `;
}

function renderModal(t) {
  return `
    <div onclick="closeModal()" style="position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.5);display:flex;align-items:flex-end;justify-content:center;padding:0 0 20px">
      <div onclick="event.stopPropagation()" style="background:#FAF8F5;border-radius:24px 24px 16px 16px;padding:28px 24px;width:100%;max-width:430px;animation:slideUp 0.2s ease">
        <div style="text-align:center;margin-bottom:16px">
          <div style="font-size:52px;margin-bottom:8px">${t.emoji}</div>
          <div style="display:inline-block;background:${t.colore};border-radius:8px;padding:3px 12px;font-size:11px;font-weight:800;color:#1A1A1E;text-transform:uppercase;margin-bottom:10px">${t.categoria}</div>
          <div style="font-size:18px;font-weight:800;color:#1A1A1E;margin-bottom:4px">${t.evento}</div>
          <div style="font-size:12px;color:#888">📍 ${t.luogo} · ${t.data}</div>
        </div>
        ${t.sbloccato
          ? `<div style="background:#EEFAF3;border:1.5px solid #B5EAD7;border-radius:12px;padding:12px 16px;text-align:center;font-size:13px;font-weight:700;color:#2A7A48">✓ Sigillo ottenuto · ${t.data}</div>`
          : `<div style="background:#F5F3EF;border:1.5px solid #E8E4DC;border-radius:12px;padding:12px 16px;text-align:center;font-size:13px;color:#AAA;line-height:1.5">◌ Visita questo luogo<br>per aggiungere il sigillo al tuo Codex</div>`
        }
        <button onclick="closeModal()" style="width:100%;margin-top:14px;background:#1A1A1E;color:#FFF;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">Chiudi</button>
      </div>
    </div>
  `;
}

function switchTab(tab) {
  currentTab = tab;
  render();
}

function openModal(id) {
  modalTimbro = TIMBRI.find(t => t.id === id);
  render();
}

function closeModal() {
  modalTimbro = null;
  render();
}

render();
</script>
</body>
</html>
